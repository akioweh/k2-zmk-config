CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
# Published TPS43 module dimensions, rotated; confirm actual active area on hardware.
CONFIG_ZMK_TRACKPAD_PHYSICAL_X=400
CONFIG_ZMK_TRACKPAD_PHYSICAL_Y=430
CONFIG_ZMK_TRACKPAD_PAD_TYPE=2

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_VDB_SIZE=100

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Enter deep sleep https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y

# Defaults to 15 minutes but 60 minutes is only very slightly more power draw and user experience is much better to not
# have keyboard go to deep sleep (i.e. having to reconenect to bluetooth)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Regular ZMK idle (30 seconds): the touchpad keeps automatic low-power scanning.
# Full sensor suspend is reserved for deep sleep; current/latency need hardware measurement.
CONFIG_ZMK_IDLE_TIMEOUT=30000

CONFIG_INPUT_THREAD_STACK_SIZE=2048
